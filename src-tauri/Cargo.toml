[package]
name = "qwen3-tts-desktop"
version = "0.1.0"
description = "桌面工具"
authors = ["Qwen3 TTS Desktop"]
edition = "2021"

[lib]
name = "qwen3_tts_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
