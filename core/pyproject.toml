[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts-engine"
version = "0.1.0"
description = "Qwen3-TTS NDJSON sidecar for Qwen TTS Desktop"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0.0",
  "huggingface-hub>=0.25.0",
  "modelscope>=1.20.0",
  "qwen-tts>=0.1.1",
  "soundfile>=0.12.1",
  "torch>=2.4.0",
  "torchaudio>=2.4.0",
  "transformers>=4.46.0",
]

[tool.setuptools.packages.find]
where = ["."]
