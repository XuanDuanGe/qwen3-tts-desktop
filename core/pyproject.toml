[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts-engine"
version = "0.1.0"
description = "Qwen3-TTS NDJSON sidecar for Qwen TTS Desktop"
requires-python = ">=3.14,<3.15"
dependencies = [
  "accelerate==1.12.0",
  "huggingface-hub==0.36.2",
  "modelscope==1.39.1",
  "qwen-tts==0.1.1",
  "soundfile==0.14.0",
  "torch==2.13.0",
  "torchaudio==2.11.0",
  "transformers==4.57.3",
]

[tool.setuptools.packages.find]
where = ["."]
